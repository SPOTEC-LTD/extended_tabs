repository: https://github.com/SPOTEC-LTD/extended_tabs
version: 5.0.0

environment:
  sdk: "^3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0

  sync_scroll_library: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
